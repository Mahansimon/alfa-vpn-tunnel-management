# Nginx پنل: سرو فایل‌های استاتیک + Reverse Proxy به بک‌اند + هدرهای امنیتی
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format alfa '$remote_addr - $status "$request" $body_bytes_sent "$http_referer" rt=$request_time';
    access_log /var/log/nginx/access.log alfa;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript
               text/xml application/xml image/svg+xml font/woff2;

    # محدودیت نرخ برای مسیرهای حساس
    limit_req_zone $binary_remote_addr zone=alfa_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=alfa_api:10m rate=30r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}

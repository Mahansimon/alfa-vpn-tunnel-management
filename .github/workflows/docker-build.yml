name: docker-build

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: ساخت ایمیج بک‌اند
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: alfa-backend:ci
      - name: ساخت ایمیج فرانت‌اند
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: alfa-frontend:ci
      - name: اعتبارسنجی docker-compose
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-temp-password/' .env
          docker compose config >/dev/null
          echo "docker-compose.yml معتبر است."
